<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Champions Lookup</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <main class="app-shell">
    <section class="search-panel">
      <h1>Pokémon Champions Lookup</h1>
      <p class="helper-text">Search a Pokémon to view compact stat ranges and Abilities.</p>

      <div class="search-row">
        <input id="pokemon-search" type="text" placeholder="Type a Pokémon name..." autocomplete="off">
        <button id="clear-button" type="button">Clear</button>
      </div>

      <div id="suggestions" class="suggestions"></div>
    </section>

    <section id="empty-state" class="card">
      <h2>No Pokémon selected</h2>
      <p>Start typing a name above.</p>
    </section>

    <section id="result-panel" class="card hidden">
      <div class="header-row">
        <div>
          <h2 id="pokemon-name">Pokémon</h2>
          <p id="pokemon-meta" class="muted"></p>
        </div>

        <div id="mega-toggle-wrapper" class="mega-wrapper hidden">
          <label for="mega-toggle">Form</label>
          <select id="mega-toggle"></select>
        </div>
      </div>

      <section class="subsection">
        <h3>Abilities</h3>
        <p class="helper-text">Tap, click, or hover an Ability to see its effect.</p>
        <ul id="ability-list" class="ability-list"></ul>
        <div id="ability-help" class="ability-help">
          <p class="helper-text">Tap, click, or hover an Ability to see its effect.</p>
        </div>
      </section>

      <section class="subsection">
        <h3>Stat ranges</h3>
        <div id="stat-grid" class="stat-grid"></div>
      </section>

      <section class="subsection">
        <h3>Dataset status</h3>
        <div id="data-status"></div>
      </section>
    </section>
  </main>

  <script src="app.js?v=4" type="module"></script>
</body>
</html>
